name: Rust

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    strategy:
      matrix:
        profile: [release]
        include:
          - container: fedora:45
            arch: x86_64

    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ matrix.container }}-${{ matrix.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system dependencies
        run: |
          dnf update -y
          dnf install -y \
            gtk4-devel \
            libadwaita-devel \
            gstreamer1-devel \
            gstreamer1-plugins-base-devel \
            openssl-devel \
            dbus-devel \
            pkgconf-pkg-config \
            rust \
            cargo \
            rustfmt \
            clippy \
            gcc \
            gcc-c++ \
            wget \
            patchelf \
            file \
            gettext

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build binaries in "${{ matrix.profile }}" mode
        run: cargo build --profile ${{ matrix.profile }} --verbose

      - name: Run tests in "${{ matrix.profile }}" mode
        run: cargo test --profile ${{ matrix.profile }} --verbose

      - name: Build packages in "${{ matrix.profile }}" mode
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          PROFILE: ${{ matrix.profile }}
        run:
          ./package/appimage/make-appimage.sh
          cargo install cargo-generate-rpm cargo-deb
          cargo generate-rpm
          cargo deb

      - name: Upload packages
        uses: actions/upload-artifact@v7
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          name: gelly-${{ matrix.profile }}-${{ matrix.arch }}
          path: |
            target/appimage/*.appimage
            target/generate-rpm/*.rpm
            target/debian/*.deb
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: gelly-release-x86_64
          path: dist

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.appimage \
            dist/*.rpm \
            dist/*.deb \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --draft --generate-notes
