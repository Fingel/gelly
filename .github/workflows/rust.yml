name: Rust

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    container: fedora:45
    strategy:
      matrix:
        profile: [debug, release]
        arch: [x86_64]

    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          dnf update -y
          dnf install -y \
            gtk4-devel \
            libadwaita-devel \
            gstreamer1-devel \
            gstreamer1-plugins-base-devel \
            openssl-devel \
            dbus-devel \
            pkgconf-pkg-config \
            rust \
            cargo \
            rustfmt \
            clippy \
            gcc \
            gcc-c++

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build binaries in "${{ matrix.profile }}" mode
        run: cargo build --profile ${{ matrix.profile }} --verbose

      - name: Run tests in "${{ matrix.profile }}" mode
        run: cargo test --profile ${{ matrix.profile }} --verbose

      - name: Build AppImage in "${{ matrix.profile }}" mode
        env:
          PROFILE: ${{ matrix.profile }}
        run: ./package/appimage/make-appimage.sh

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: gelly-${{ matrix.profile }}-${{ matrix.arch }}
          path: |
            target/${{ matrix.profile }}/gelly
            target/appimage/gelly-${{ matrix.profile }}-${{ matrix.arch }}.appimage
