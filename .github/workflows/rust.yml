name: Rust

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  BIN_NAME: gelly
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    container: fedora:45
    strategy:
      matrix:
        profile: [debug, release]
        arch: [x86_64]

    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          dnf update -y
          dnf install -y \
            gtk4-devel \
            libadwaita-devel \
            gstreamer1-devel \
            gstreamer1-plugins-base-devel \
            openssl-devel \
            dbus-devel \
            pkgconf-pkg-config \
            rust \
            cargo \
            rustfmt \
            clippy \
            gcc \
            gcc-c++ \
            wget \
            patchelf \
            file

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build binaries in "${{ matrix.profile }}" mode
        run: cargo build --profile ${{ matrix.profile }} --verbose

      - name: Run tests in "${{ matrix.profile }}" mode
        run: cargo test --profile ${{ matrix.profile }} --verbose

      - name: Build AppImage in "${{ matrix.profile }}" mode
        env:
          PROFILE: ${{ matrix.profile }}
        run: ./package/appimage/make-appimage.sh

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.profile }}-${{ matrix.arch }}
          path: |
            target/${{ matrix.profile }}/${{ env.BIN_NAME }}
            target/appimage/${{ env.BIN_NAME }}-${{ matrix.profile }}-${{ matrix.arch }}.appimage

  release:
    runs-on: ubuntu-latest
    container: fedora:45
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
      
      - name: Download artifacts
        uses: actions/download-artifact@v8

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            **/*.appimage \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --draft --generate-notes
