[package]
name = "gelly"
version = "2.0.0"
edition = "2024"
license = "GPL-3.0-only"
description = "A native, lightweight music client for Jellyfin and Subsonic"

[package.metadata.generate-rpm]
requires = { gtk4 = "*", libadwaita = "*", gstreamer1-plugins-good = "*" }
assets = [
    { source = "target/release/gelly", dest = "/usr/bin/gelly", mode = "755" },
    { source = "resources/io.m51.Gelly.desktop", dest = "/usr/share/applications/io.m51.Gelly.desktop", mode = "644" },
    { source = "resources/io.m51.Gelly.metainfo.xml", dest = "/usr/share/metainfo/io.m51.Gelly.metainfo.xml", mode = "644" },
    { source = "resources/io.m51.Gelly.gschema.xml", dest = "/usr/share/glib-2.0/schemas/io.m51.Gelly.gschema.xml", mode = "644" },
    { source = "resources/io.m51.Gelly.svg", dest = "/usr/share/icons/hicolor/scalable/apps/io.m51.Gelly.svg", mode = "644" },
    { source = "resources/io.m51.Gelly-symbolic.svg", dest = "/usr/share/icons/hicolor/symbolic/apps/io.m51.Gelly-symbolic.svg", mode = "644" },
]
post_install_script = "glib-compile-schemas $RPM_BUILD_ROOT/usr/share/glib-2.0/schemas"
post_uninstall_script = "glib-compile-schemas $RPM_BUILD_ROOT/usr/share/glib-2.0/schemas"

[package.metadata.deb]
maintainer = "Austin Riba <austin@m51.io>"
copyright = "2026, Austin Riba"
license-file = ["LICENSE", "0"]
section = "sound"
priority = "optional"
depends = ["$auto", "libgtk4-1", "libadwaita-1-0"]
assets = [
    ["target/release/gelly", "usr/bin/gelly", "755"],
    ["resources/io.m51.Gelly.desktop", "usr/share/applications/io.m51.Gelly.desktop", "644"],
    ["resources/io.m51.Gelly.metainfo.xml", "usr/share/metainfo/io.m51.Gelly.metainfo.xml", "644"],
    ["resources/io.m51.Gelly.gschema.xml", "usr/share/glib-2.0/schemas/io.m51.Gelly.gschema.xml", "644"],
    ["resources/io.m51.Gelly.svg", "usr/share/icons/hicolor/scalable/apps/io.m51.Gelly.svg", "644"],
    ["resources/io.m51.Gelly-symbolic.svg", "usr/share/icons/hicolor/symbolic/apps/io.m51.Gelly-symbolic.svg", "644"],
]

[dependencies]
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_22"] }
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_9"] }
log = { version = "0.4.34", features = ["std"] }
env_logger = { version = "0.11.11", features = ["color"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "sync", "fs"] }
reqwest = { version = "0.13.5", features = ["json", "query"] }
serde_json = { version = "1.0.154", features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
gstreamer = { version = "0.25.4", features = ["v1_28"] }
gstreamer-pbutils = { version = "0.25.4", features = ["v1_28"] }
async-channel = "2.5.0"
futures-util = "0.3.34"
mpris-server = "0.11.0"
glycin = { version = "4.0.3", features = ["gdk4"] }
futures = "0.3.34"
uuid = { version = "1.28.0", features = ["v4"] }
rand = "0.10.3"
md5 = "0.8.1"
num_enum = "0.7.6"
lru = "0.19.0"
gettext-rs = { version = "0.8.0", features = ["gettext-system"] }
oo7 = { version = "0.6.0", default-features = false, features = ["async-std", "native_crypto"] }
async-io = "2.6.0"
diacritics = "0.2.2"

[build-dependencies]
glib-build-tools = "0.22.8"
